name: Reader checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run vendor:auth
      - run: git diff --exit-code -- vendor/
      - run: npm test
      - name: Install PostgreSQL test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-client libpq-dev
      - name: PostgreSQL permission tests
        run: |
          export ANCHOR_PG_BIN="$(pg_config --bindir)"
          npm run test:backend
